; Lora_C3_v1.4 【中文版 · 可直接覆盖刷（不要全擦）】
; 基线：官方 v2.7.26.54e0d8d
;
; 设计目标（2026-09-18 07:38 重做）：
;   - 与用户已验证能亮的版本**只差"中文"这一件事**：
;       stock 4MB 分区表（不改分区！）+ 功能裁剪（同 build10）+ GPS 关 + TFT_INVERT true（颜色正常）
;       + 中文渲染（CJK_FONT_ENABLED=1）
;   - app 体积：build10 是 2,276,816 B，加中文字模 ~96KB ⇒ ~2.37MB，stock 槽 2,424,832 B 装得下
;   - 刷法：**只写 0x0（bootloader+分区表+app）+ 可选 littlefs**，**绝不要 erase-flash**
;     （全擦会清空 NVS 配置 —— 那是历次"黑屏"的真正共同点）
[env:lora-c3]
extends = esp32c3_base
; 2026-09-18 22:0x 单变量测试：换老框架，验证 LittleFS 兼容性
platform = espressif32@6.11.0  ; 2026-09-19：本机已装 framework 2.0.17（免下载）；配合 dout 修复
board = esp32-c3-devkitm-1
board_build.flash_mode = dout   ; ★ 2026-09-19 修复：本机框架库是 dout 编译的，DIO/QIO 会导致 LittleFS 挂载与格式化全失败
board_level = extra
build_flags = 
  ${esp32c3_base.build_flags}
  -D PRIVATE_HW
  ; 本板串口走 C3 原生 USB-Serial/JTAG ⇒ 必须开 USB CDC
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  ; 功能裁剪（塞进 stock 2368K app 槽；商家功能集等中文版验证通过后再单独加）
  -D MESHTASTIC_EXCLUDE_WEBSERVER=1
  -D MESHTASTIC_EXCLUDE_PAXCOUNTER=1
  ; 中文渲染（渲染器补丁 tools/patch_oled_cjk.py + 字模 src/graphics/fonts/CJKBitmapFont.cpp）
  -D CJK_FONT_ENABLED=1
  ; ★ 2026-09-18 09:55 电台修复：E22-400M22S 必须由 DIO3 供 1.8V 给 TCXO 才能起振。
  ;   不加这条，RadioInterface.cpp 的 SX1268 TCXO 分支不参与编译（条件含 TCXO_OPTIONAL），
  ;   串口表现为 'SX126X_DIO3_TCXO_VOLTAGE not defined' + 'init result -2' + 'critical error 3'。
  ;   加上后走 L379 分支：先试 TCXO 1.8V，失败再自动回退 XTAL，与厂商固件形态一致。
  -D TCXO_OPTIONAL=1
  -I variants/esp32c3/lora-c3
monitor_speed = 115200
upload_protocol = esptool
upload_speed = 921600

; 屏要用 LovyanGFX 的 TFTDisplay（上游所有 TFT 变体都显式加这条）
lib_deps =
  ${esp32c3_base.lib_deps}
  # renovate: datasource=custom.pio depName=LovyanGFX packageName=lovyan03/library/LovyanGFX
  lovyan03/LovyanGFX@1.2.21
